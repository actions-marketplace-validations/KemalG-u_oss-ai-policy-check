name: release

# Publishes to PyPI when a version tag (v0.3.0, ...) is pushed. PyPI Trusted Publishing is used: there is no
# API token in this repository. One-time setup steps are in docs/release.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Check that the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python -c "import re,pathlib;print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/oss_ai_policy_check/__init__.py').read_text()).group(1))")"
          if [ "${TAG}" != "v${version}" ]; then
            echo "::error::tag ${TAG} does not match the package version ${version}"
            exit 1
          fi

      - name: Run the offline tests
        run: python -X utf8 -B -m unittest discover -s tests

      - name: Build the sdist and the wheel
        run: |
          python -m pip install --disable-pip-version-check --quiet build==1.6.1 twine==7.0.0
          python -m build
          python -m twine check --strict dist/*

      - name: Check the wheel contents
        run: |
          python - <<'PY'
          import glob
          import zipfile

          (wheel,) = glob.glob("dist/*.whl")
          names = zipfile.ZipFile(wheel).namelist()
          required = ("oss_ai_policy_check/rules/patterns.json", "oss_ai_policy_check/cli.py")
          missing = [name for name in required if not any(n.endswith(name) for n in names)]
          if missing:
              raise SystemExit(f"wheel is missing: {missing}")
          print(f"{wheel}: {len(names)} files, required files present")
          PY

      - name: Smoke test the built wheel
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/python -m pip install --quiet dist/*.whl
          /tmp/wheel-venv/bin/oss-ai-policy-check --version

      - name: Upload the distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/oss-ai-policy-check/
    permissions:
      id-token: write # Trusted Publishing; this job only
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true # PEP 740 attestations (the default; stated so it stays on); needs Trusted Publishing
