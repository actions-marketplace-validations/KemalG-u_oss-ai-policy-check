name: index

# Weekly AI contribution policy index: scans popular repositories with the product's own rules mode (no key, no
# model), then commits the result under index/. Read-only towards the scanned repositories.
# The scan job only reads; only the commit job can write, and it runs no scan code.

on:
  schedule:
    - cron: "0 4 * * 1"  # Monday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: index
  cancel-in-progress: false

jobs:
  scan:
    name: Scan
    if: github.repository == 'KemalG-u/oss-ai-policy-check'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build the index
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -X utf8 scripts/build_index.py

      - name: Keep the result for the commit job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: index
          path: index/
          if-no-files-found: error
          retention-days: 7

  commit:
    name: Commit
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # the only job that can push
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the result
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: index
          path: index/

      - name: Commit and push when something changed
        env:
          GITHUB_TOKEN: ${{ github.token }}  # used for the push only, never stored in the checkout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index
          if git diff --cached --quiet; then
            echo "No change in index/, nothing to commit."
            exit 0
          fi
          git commit -m "Update AI contribution policy index ($(date -u +%F))"
          git pull --rebase origin main
          AUTH="Authorization: basic $(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=${AUTH}" push origin HEAD:main
